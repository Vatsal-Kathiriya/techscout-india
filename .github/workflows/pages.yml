name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload site artifact
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.setup_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Skip deployment when Pages is not configured
        if: steps.setup_pages.outcome != 'success'
        run: echo "GitHub Pages is not enabled for this repository. Skipping deployment."
