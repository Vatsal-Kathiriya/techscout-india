[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_ADSENSE_PUB_ID,NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION,AMAZON_AFFILIATE_TAG"

[[plugins]]
  package = "@netlify/plugin-nextjs"
